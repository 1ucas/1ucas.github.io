<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Share card artwork — Lucas Maciel</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { position: relative; background: #0b0f14; color: #e8eef5; font-family: "Liberation Sans", Arial, sans-serif; }
    .art { position: absolute; inset: 0 0 0 50%; background: url("art/hero.webp") 52% 50% / cover; opacity: .19; mask-image: linear-gradient(90deg, transparent, #000); }
    .glow { position: absolute; inset: 0; background: radial-gradient(ellipse at 92% 15%, #ffb45418, transparent 60%); }
    .top { position: absolute; inset: 48px 64px auto; display: flex; align-items: center; gap: 14px; }
    .mark { width: 50px; height: 50px; border: 1px solid #ffb45444; border-radius: 13px; }
    .handle { color: #ffb454; font: 23px "Liberation Mono", monospace; }
    .role { position: absolute; top: 164px; left: 68px; margin: 0; color: #ffb454; font-size: 21px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
    h1 { position: absolute; top: 204px; left: 64px; margin: 0; font-size: 82px; line-height: 1.1; letter-spacing: -3px; }
    .craft { position: absolute; top: 320px; left: 68px; margin: 0; color: #bdc9d6; font-size: 29px; line-height: 1.5; }
    .portrait { position: absolute; top: 150px; right: 68px; width: 300px; height: 300px; padding: 9px; border: 1px solid #ffb45466; border-radius: 50%; background: #0b0f14; }
    .portrait img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .footer { position: absolute; inset: auto 68px 48px; border-top: 1px solid #2b3440; padding-top: 25px; display: flex; justify-content: space-between; align-items: center; }
    .projects { font-size: 22px; color: #bdc9d6; }
    .projects strong { color: #e8eef5; font-weight: 600; }
    .url { color: #ffb454; font: 22px "Liberation Mono", monospace; }
  </style>
</head>
<body>
  <div class="art"></div>
  <div class="glow"></div>
  <div class="top"><img class="mark" src="icon.svg" alt=""><span class="handle">@1ucas</span></div>
  <p class="role">Software Architect</p>
  <h1>Lucas Maciel</h1>
  <p class="craft">Mobile architecture.<br>Developer tooling. AI agents.</p>
  <div class="portrait"><img src="avatar.png" alt="Lucas Maciel"></div>
  <div class="footer"><span class="projects">Creator of <strong>Indilo &amp; Takonto</strong></span><span class="url">1ucas.github.io</span></div>
</body>
</html>

<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Lucas Maciel</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0f14">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) { }
      var light = saved ? saved === "light"
        : window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = light ? "light" : "dark";
      document.documentElement.style.colorScheme = light ? "light" : "dark";
    })();
  </script>
  <style>
    .lost {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* scoped past `.lost p` below, which would otherwise win on specificity */
    .lost .lost-code {
      font-family: var(--mono);
      font-size: clamp(4rem, 18vw, 9rem);
      font-weight: 700;
      letter-spacing: -.05em;
      line-height: 1;
      color: var(--accent);
    }

    .lost h1 {
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      margin: 1rem 0 .75rem;
    }

    .lost p {
      color: var(--muted);
      max-width: 42ch;
      margin-inline: auto;
    }

    .lost .btn {
      margin-top: 2rem;
    }

    .lost-art {
      position: absolute;
      inset: 0;
      background: url("/assets/art/lost.webp") center / cover no-repeat;
      opacity: .22;
      -webkit-mask-image: radial-gradient(60% 60% at 50% 55%, transparent 15%, #000 85%);
      mask-image: radial-gradient(60% 60% at 50% 55%, transparent 15%, #000 85%);
      pointer-events: none;
    }

    :root[data-theme="light"] .lost-art {
      opacity: .16;
    }

    .lost .wrap {
      position: relative;
    }
  </style>
</head>

<body>
  <main class="lost">
    <div class="lost-art" aria-hidden="true"></div>
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="wrap">
      <p class="lost-code">404</p>
      <h1>This page took a wrong turn</h1>
      <p>The link is broken, moved, or never existed. No shame either way.</p>
      <a class="btn btn-primary" href="/">Back home</a>
    </div>
  </main>
</body>

</html>
